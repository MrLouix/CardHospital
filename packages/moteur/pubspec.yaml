name: moteur_cardhospital
description: >-
  Moteur de jeu CardHospital : modèles, validateur, moteur d'effets et
  simulateur. Paquet Dart pur, sans dépendance à Flutter ni au réseau.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.13.0

dependencies:
  json_annotation: ^4.9.0

dev_dependencies:
  build_runner: ^2.4.0
  json_serializable: ^6.8.0
  lints: ^6.1.0
  test: ^1.25.0
