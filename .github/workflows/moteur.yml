name: moteur

on:
  push:
    branches: [main]
  pull_request:

jobs:
  moteur:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/moteur
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - run: dart pub get
      - run: dart format --set-exit-if-changed lib test bin tool
      - run: dart analyze --fatal-infos
      - name: Tests avec mesure de couverture
        run: dart run coverage:test_with_coverage -o coverage
      - name: Couverture ≥ 90 % (hors code généré)
        run: dart run tool/couverture.dart 90
      - name: Valide l'exemple et le paquet de base (schéma complet et contrôles sémantiques)
        run: |
          dart run tool/valider_paquet.dart ../../docs/exemples/jeu.exemple.json
          dart run tool/valider_paquet.dart ../../contenu/paquet_base.json
